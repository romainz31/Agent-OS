<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agent-OS</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <h1>Agent-OS</h1>

            <button
                id="newChatButton"
                class="new-chat-button"
            >
                + Nouveau chat
            </button>

        </div>


        <!-- =================================================
             LISTE DES CHATS
             ================================================= -->

        <div
            id="chatList"
            class="chat-list"
        >

            <div class="empty-chats">
                Aucun chat
            </div>

        </div>


        <!-- =================================================
             MÉMOIRE
             ================================================= -->

        <div class="memory-section">

            <h3>Mémoires</h3>

            <button
                class="memory-button planner-memory"
                data-memory="planner"
            >
                🧠 Reset Planner
            </button>

            <button
                class="memory-button developer-memory"
                data-memory="developer"
            >
                💻 Reset Developer
            </button>

            <button
                class="memory-button tester-memory"
                data-memory="tester"
            >
                🧪 Reset Tester
            </button>

            <button
                class="memory-button researcher-memory"
                data-memory="researcher"
            >
                🌐 Reset Researcher
            </button>

            <button
                class="memory-button shared-memory"
                data-memory="shared"
            >
                👥 Reset mémoire partagée
            </button>

        </div>

    </aside>


    <!-- =====================================================
         ZONE PRINCIPALE
         ===================================================== -->

    <main class="main">

        <!-- ================================================
             HEADER
             ================================================ -->

        <header class="chat-header">

            <div>

                <h2 id="chatTitle">
                    Aucun chat
                </h2>

                <div
                    id="chatAgents"
                    class="chat-agents"
                >
                </div>

            </div>

        </header>


        <!-- ================================================
             MESSAGES
             ================================================ -->

        <section
            id="messages"
            class="messages"
        >

            <div class="welcome">

                <h2>Agent-OS</h2>

                <p>
                    Crée un chat et sélectionne les agents
                    que tu souhaites utiliser.
                </p>

            </div>

        </section>


        <!-- ================================================
             INPUT
             ================================================ -->

        <footer class="input-area">

            <textarea
                id="messageInput"
                placeholder="Écris ton message..."
                rows="1"
            ></textarea>

            <button
                id="sendButton"
                class="send-button"
            >
                Envoyer
            </button>

        </footer>

    </main>

</div>


<!-- =========================================================
     MODAL NOUVEAU CHAT
     ========================================================= -->

<div
    id="newChatModal"
    class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>Nouveau chat</h2>

            <button
                id="closeModalButton"
                class="close-button"
            >
                ×
            </button>

        </div>


        <p class="modal-description">

            Sélectionne un ou plusieurs agents.

            <br>

            Ils travailleront ensemble dans ce chat.

        </p>


        <!-- =================================================
             AGENTS
             ================================================= -->

        <div
            id="agentSelector"
            class="agent-selector"
        >

            <label class="agent-option">

                <input
                    type="checkbox"
                    value="planner"
                >

                <span class="agent-icon">
                    🧠
                </span>

                <span class="agent-info">

                    <strong>
                        Planner
                    </strong>

                    <small>
                        Planification
                    </small>

                </span>

            </label>


            <label class="agent-option">

                <input
                    type="checkbox"
                    value="developer"
                >

                <span class="agent-icon">
                    💻
                </span>

                <span class="agent-info">

                    <strong>
                        Developer
                    </strong>

                    <small>
                        Développement
                    </small>

                </span>

            </label>


            <label class="agent-option">

                <input
                    type="checkbox"
                    value="tester"
                >

                <span class="agent-icon">
                    🧪
                </span>

                <span class="agent-info">

                    <strong>
                        Tester
                    </strong>

                    <small>
                        Validation
                    </small>

                </span>

            </label>


            <label class="agent-option">

                <input
                    type="checkbox"
                    value="researcher"
                >

                <span class="agent-icon">
                    🌐
                </span>

                <span class="agent-info">

                    <strong>
                        Researcher
                    </strong>

                    <small>
                        Recherche Web
                    </small>

                </span>

            </label>

        </div>


        <!-- =================================================
             ACTIONS
             ================================================= -->

        <div class="modal-actions">

            <button
                id="cancelChatButton"
                class="secondary-button"
            >
                Annuler
            </button>

            <button
                id="createChatButton"
                class="primary-button"
            >
                Créer le chat
            </button>

        </div>

    </div>

</div>


<script
    src="{{ url_for('static', filename='app.js') }}"
></script>

</body>

</html>
