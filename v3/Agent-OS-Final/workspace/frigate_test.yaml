frigate:
  version: 0.50.0
  cameras:
    camera_01:
      source: rtsp://admin:12345678@192.168.1.64:554/Streaming/Channels/101
      monitors:
        - face
        - license_plate
  mqtt:
    host: mqtt.example.com
    port: 1883
    username: mqttuser
    password: mqttpassword
    topics:
      - topic: /frigate/face/01
        subscribe: true
        publish: true
      - topic: /frigate/license_plate/01
        subscribe: true
        publish: true